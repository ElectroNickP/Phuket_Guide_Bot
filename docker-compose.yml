services:
  redis:
    image: redis:alpine
    container_name: best_sea_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  bot:
    build: .
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./google service account:/app/google service account
      - tunnel_shared:/app/shared
    env_file:
      - .env
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - redis

  tunnel:
    build:
      context: ./docker/tunnel
    volumes:

      - tunnel_shared:/app/shared
    restart: always
    depends_on:
      - bot

volumes:
  redis_data:
  tunnel_shared:

