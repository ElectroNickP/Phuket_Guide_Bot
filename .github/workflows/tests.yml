name: Bot Test Suite

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare mock environment
      run: |
        mkdir -p data
        # We also need basic config for tests, copying from .env.example if available,
        # or defining dummy expected environment variables in the workflow.

    - name: Run Pytest
      env:
        BOT_TOKEN: "123456789:AABBCcDDeEFFggHHiiJJKKLL"
        ADMIN_IDS: "123456789"
        SPREADSHEET_ID: "dummy_sheet"
        SEA_SPREADSHEET_ID: "dummy_sea_sheet"
        CREDENTIALS_FILE: "dummy_creds.json"
      run: |
        pytest -v
