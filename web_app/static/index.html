<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phuket Guide App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
    <!-- Google Fonts for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <header class="app-header">
            <div style="display: flex; align-items: center; margin-bottom: 8px;">
                <img src="/static/img/logo.png" alt="Best" style="height: 36px; margin-right: 12px; object-fit: contain;">
                <h1 id="greeting">Loading...</h1>
            </div>
            <p id="date-display" class="subtitle"></p>
            <!-- Diagnostic Info (Small & Subtle) -->
            <div id="debug-auth-info" style="font-size: 10px; color: var(--hint-color); margin-top: 4px; opacity: 0.6;"></div>
        </header>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-target="schedule-tab">Schedule</button>
            <button class="tab-btn" data-target="reports-tab">Reports</button>
        </div>

        <!-- Main Content Area -->
        <main class="content-area">
            
            <!-- Schedule Tab Content (Guide View) -->
            <div id="schedule-tab" class="tab-content active">
                <div id="schedule-loading" class="loader">Loading data...</div>
                <div id="schedule-cards" class="cards-container">
                    <!-- Cards will be injected via JS -->
                </div>
            </div>

            <!-- Pier Manager View (Hidden by default) -->
            <div id="manager-view" class="tab-content manager-view-container" style="display: none;">
                <div class="manager-header">
                    <h2 id="manager-pier-title">Pier: ---</h2>
                    <div class="session-badge" id="session-status">Session Closed</div>
                </div>

                <div id="session-controls" class="card premium-card">
                    <button id="open-session-btn" class="tg-button success">🟢 Open New Session</button>
                </div>

                <div id="cash-register" style="display: none;">
                    <div class="pos-layout">
                        <!-- Product Grid -->
                        <div class="product-grid" id="product-grid">
                            <!-- Products injected here -->
                        </div>

                        <!-- Shopping Cart / Sidebar -->
                        <div class="cart-sidebar card">
                            <h3>🛒 Cart</h3>
                            <div id="cart-items" class="cart-items-list">
                                <!-- Cart items -->
                            </div>
                            <div class="cart-footer">
                                <div class="cart-total">Total: <span id="cart-total-amount">0</span>฿</div>
                                <div class="payment-selection">
                                    <button class="pay-btn cash" data-type="cash">💵 Cash</button>
                                    <button class="pay-btn online" data-type="online">📱 Online</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="report-container" class="card report-section" style="display: none; margin-top: 1rem;">
                    <h3 id="report-title">📊 Shift Report</h3>
                    <div id="session-report-summary" class="report-summary">
                        <!-- Report data -->
                    </div>
                    <button id="close-session-btn" class="tg-button danger" style="margin-top: 1rem;">🔴 Close Session</button>
                </div>
            </div>

            <!-- Reports Tab Content -->
            <div id="reports-tab" class="tab-content" style="display: none;">
                
                <div class="card premium-card">
                    <h2>🚀 Program Start</h2>
                    <form id="start-report-form">
                        <div class="form-group">
                            <label>Actual start time</label>
                            <input type="time" id="start-time" required class="tg-input">
                        </div>
                        <div class="form-group">
                            <label>Actual number of guests (Adults)</label>
                            <input type="number" id="start-pax-adults" placeholder="0" required class="tg-input">
                        </div>
                        <div class="form-group">
                            <label>Actual number of children</label>
                            <input type="number" id="start-pax-children" placeholder="0" required class="tg-input">
                        </div>
                        <div class="form-group">
                            <label>Comment (optional)</label>
                            <textarea id="start-comment" placeholder="Write if guests are late or no-show..." class="tg-input"></textarea>
                        </div>
                        <button type="submit" class="tg-button">Send Start</button>
                    </form>
                </div>

                <div class="card premium-card" style="margin-top: 1rem;">
                    <h2>🏁 Program Finish</h2>
                    <form id="finish-report-form">
                        <div class="form-group">
                            <label>Actual finish time</label>
                            <input type="time" id="finish-time" required class="tg-input">
                        </div>
                        <button type="submit" class="tg-button">Send Finish</button>
                    </form>
                </div>

            </div>

        </main>
    </div>

    <!-- Success Popup -->
    <div id="success-popup" style="display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(76, 175, 80, 0.95); backdrop-filter: blur(8px); color: white; padding: 12px 24px; border-radius: 30px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: 600; text-align: center; font-size: 15px; opacity: 0; transition: opacity 0.3s ease;">
        ✅ Purchase Completed
    </div>

    <!-- Initialization and Logic -->
    <script src="/static/js/app.js?v=9"></script>
</body>
</html>
