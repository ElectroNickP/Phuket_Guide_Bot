<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Best Sea — Заказать онлайн</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=2.2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --tourist-bg: #fdfdfd;
            --accent-gold: #D4AF37;
            --accent-blue: #007AFF;
        }
        
        body {
            background: var(--tourist-bg);
            color: #1a1a1a;
        }

        .tourist-header {
            padding: 24px 20px;
            background: white;
            border-bottom: 4px solid var(--accent-blue);
            text-align: center;
        }
        
        .tourist-header h1 {
            font-size: 22px;
            font-weight: 900;
            margin: 0;
            color: #000;
        }

        .promo-banner {
            margin: 16px;
            padding: 20px;
            background: linear-gradient(135deg, var(--accent-blue), #00c2a8);
            border-radius: 16px;
            color: white;
            box-shadow: 0 8px 16px rgba(0, 122, 255, 0.2);
        }

        .promo-banner h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .promo-banner p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Responsive Grid */
        .products-grid {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            border: 1px solid #f0f0f0;
        }

        .product-card:active {
            transform: scale(0.97);
        }

        .product-img-placeholder {
            width: 100%;
            height: 120px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .product-info h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px 0;
            height: 34px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .add-btn {
            margin-top: 10px;
            background: #f0f0f0;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* Cart FAB */
        .cart-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            left: 24px;
            height: 60px;
            background: var(--accent-blue);
            color: white;
            border-radius: 30px;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.4);
            font-weight: 700;
            z-index: 100;
        }

        .checkout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
        }

        .checkout-sheet {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .checkout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .pay-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            margin-top: 24px;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="tourist-header">
        <h1>BEST SEA STORE</h1>
    </header>

    <div class="promo-banner">
        <h2>Заказывайте онлайн!</h2>
        <p>Оплачивайте безопасно через СБП/NSPK и забирайте на пирсе.</p>
    </div>

    <!-- Category Filter -->
    <div class="category-pills" id="tourist-cats" style="padding: 0 16px; display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px;"></div>

    <main class="products-grid" id="tourist-grid">
        <!-- Products will load here -->
    </main>

    <div id="cart-fab" class="cart-fab" onclick="showCheckout()">
        <span id="cart-count">0 товаров</span>
        <span id="cart-total">0฿</span>
    </div>

    <!-- Checkout Overlay -->
    <div id="checkout-overlay" class="checkout-overlay">
        <div class="checkout-sheet">
            <div class="checkout-header">
                <h2 style="margin:0">Ваш заказ</h2>
                <button onclick="hideCheckout()" style="background:none; border:none; font-size:24px; color:#aaa">✕</button>
            </div>
            
            <div id="checkout-items" style="margin-bottom:20px;"></div>
            
            <div style="border-top: 1px solid #eee; padding-top:16px;">
                <div style="display:flex; justify-content:space-between; font-weight:700; font-size:20px;">
                    <span>Итого:</span>
                    <span id="final-total">0฿</span>
                </div>
            </div>

            <button id="pay-button" class="pay-btn" onclick="processCheckout()">
                <span>Оплатить через NSPK</span>
            </button>
        </div>
    </div>

    <script src="/static/js/tourist.js?v=1.0"></script>
</body>
</html>
